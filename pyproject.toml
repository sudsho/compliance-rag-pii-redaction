[project]
name = "compliance-rag-pii-redaction"
version = "0.1.0"
description = "HIPAA-scoped compliance-aware RAG with Presidio, Bedrock Guardrails, per-user ACLs, tamper-evident audit."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sudhanshu Srivastava"}]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: needs live AWS / Postgres / ChromaDB",
    "slow: > 5s",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]
