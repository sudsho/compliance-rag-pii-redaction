app:
  name: compliance-rag
  env: dev

ingest:
  chunk_size: 800
  overlap: 120
  sources:
    - path: data/sample_policies
      patterns: ["*.md", "*.pdf", "*.docx"]

embed:
  provider: bedrock         # bedrock | local
  bedrock_model: amazon.titan-embed-text-v2:0
  local_model: intfloat/e5-small-v2

store:
  provider: chromadb
  collection: policies
  persist_dir: .chroma

retrieve:
  k_dense: 8
  k_bm25: 8
  fusion: rrf               # rrf | linear
  rrf_k: 60
  final_k: 6

generate:
  provider: bedrock
  model: anthropic.claude-3-5-sonnet-20240620-v1:0
  temperature: 0.1
  max_tokens: 1024
  system_prompt_file: configs/system_prompt.md
  require_citations: true

guardrails:
  provider: bedrock
  guardrail_id_env: BEDROCK_GUARDRAIL_ID
  version_env: BEDROCK_GUARDRAIL_VERSION
  fail_closed: true         # deny on any guardrail intervention

audit:
  db_url_env: AUDIT_DB_URL
  hash_algo: sha256
  include_prompt: false     # only redacted prompt hash goes to audit
  include_response: false

otel:
  service_name: compliance-rag
  exporter: otlp
  endpoint_env: OTEL_EXPORTER_OTLP_ENDPOINT

acl:
  # default sensitivity policy applied when doc metadata is missing
  default_sensitivity: internal
  fail_closed: true         # if jwt has no roles, deny
